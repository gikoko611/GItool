<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#031014"><title>G.I TOOL</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 0,#10352a 0,transparent 40%),#020b10;color:#f1f7f8;font-family:system-ui,Arial,sans-serif;padding:18px 15px 86px}.head{display:flex;align-items:center;gap:13px;margin:10px 0 20px}.logo{width:64px;height:64px;border:2px solid #d9b34c;border-radius:50%;display:grid;place-items:center;color:#f7ce64;font-size:27px;font-weight:900;box-shadow:0 0 22px #27ff7755}.brand{font-size:27px;font-weight:900;letter-spacing:1px;background:linear-gradient(90deg,#35ff91,#ffd15d);color:transparent;background-clip:text}.sub{font-size:11px;letter-spacing:2px;color:#bdced2}.search,.field,textarea,select{width:100%;padding:13px;border-radius:13px;background:#0c1b22;border:1px solid #2b5555;color:white;font-size:15px;outline:none;margin:5px 0 10px}.hero{margin:17px 0;padding:20px;border:1px solid #13d98b;border-radius:20px;background:linear-gradient(120deg,#102e27,#07151d)}.hero h2{margin:6px 0;font-size:24px}.green{color:#48f69a}.pill{display:inline-block;border:1px solid #37f596;border-radius:30px;padding:6px 12px;margin:7px 0;font-weight:700}.muted{color:#9cb5c4;font-size:13px}.filters{display:flex;gap:8px;overflow:auto;margin:14px 0}.filter,.btn{white-space:nowrap;background:#0b1a21;color:#b8d1d8;border:1px solid #28504f;border-radius:24px;padding:10px 13px}.filter.active,.btn.primary{background:#43f59a;color:#032016;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{min-height:115px;padding:13px 11px;background:linear-gradient(145deg,#10232b,#08151b);border:1px solid #244650;border-radius:16px;display:flex;flex-direction:column;gap:7px;cursor:pointer}.ico{font-size:25px}.name{font-weight:750;font-size:14px}.desc{font-size:11px;color:#9cb5c4;line-height:1.4}.count{color:#50f6a0;font-size:11px;margin-top:auto}.bottom{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:#07151cf5;border-top:1px solid #25444a;padding:10px 4px max(10px,env(safe-area-inset-bottom));backdrop-filter:blur(15px)}.bottom button{border:0;background:none;color:#8eacba;font-size:11px}.bottom b{display:block;font-size:20px;margin-bottom:2px}.section{font-size:13px;color:#c3d6d9;margin:17px 2px 10px}.panel{background:#0a171e;border:1px solid #28504f;border-radius:18px;padding:16px;margin-top:15px}.panel h2{margin:5px 0 12px}.result{white-space:pre-wrap;overflow-wrap:anywhere;background:#061116;border:1px solid #24434a;border-radius:12px;padding:12px;min-height:45px;margin:10px 0;color:#68f6a7}.row{display:flex;gap:8px;flex-wrap:wrap}.row .btn{flex:1}.back{background:none;border:1px solid #477064;color:#8dfab6;border-radius:20px;padding:9px 14px;margin:5px 0}.empty{grid-column:1/-1;text-align:center;color:#9cb5c4;padding:25px}label{font-size:12px;color:#a9c4cc}
</style></head>
<body><header class="head"><div class="logo">GI</div><div><div class="brand">G.I TOOL</div><div class="sub">ALL-IN-ONE TOOLKIT</div><div class="muted">Simple • Fast • Powerful</div></div></header>
<div id="home"><input class="search" id="search" placeholder="⌕  Search tools..."/><section class="hero"><div style="color:#f7c85d">♛ YOUR DIGITAL TOOLKIT</div><h2>Your digital<br><span class="green">Swiss Army knife</span></h2><span class="pill">120+ TOOLS</span><div class="muted">Work • Create • Manage • Secure</div></section><div class="section">EXPLORE TOOLS</div><div class="filters" id="filters"></div><main class="grid" id="grid"></main></div>
<div id="toolview" hidden><button class="back" onclick="goHome()">← All tools</button><section class="panel"><div class="muted">G.I TOOL UTILITY</div><h2 id="tooltitle">Tool</h2><div id="toolbody"></div></section></div>
<nav class="bottom"><button onclick="goHome()"><b>⌂</b>Home</button><button onclick="document.getElementById('filters').scrollIntoView({behavior:'smooth'})"><b>▦</b>Categories</button><button onclick="showFavorites()"><b>♡</b>Favorites</button><button onclick="showAbout()"><b>⚙</b>About</button></nav>
<script>
const groups=[['AI Assistant','🧠','AI','Chat • Generate • Analyze'],['PDF Tools','📕','Files','Convert • Merge • Split'],['Image Studio','🖼️','Media','Edit • Resize • Compress'],['Video Tools','🎬','Media','Convert • Compress • Edit'],['Audio Lab','🎵','Media','Trim • Convert • Record'],['QR & Barcode','▦','Create','QR text helper'],['File Manager','📁','Files','File utilities'],['Network Tools','🌐','Network','Network helper'],['Developer','</>','Developer','JSON • Base64 • URL'],['Security Check','🛡️','Security','Hash • Password'],['Text Utilities','Tt','Text','Format • Count • Convert'],['Unit Converter','🧮','Convert','Length • Weight • Time'],['Calculator','🧮','Convert','Basic calculator'],['Notes','📝','Productivity','Save local notes'],['Password Generator','🔐','Security','Generate strong passwords'],['Color Picker','🎨','Create','HEX • RGB'],['Markdown Editor','📄','Developer','Write and preview'],['JSON Formatter','{ }','Developer','Format • Validate'],['UUID Generator','🧬','Developer','Create unique IDs'],['World Clock','🕒','Productivity','Current date and time'],['Stopwatch','⏱️','Productivity','Start • Stop • Reset'],['QR Reader','📷','Create','Paste QR text or payload'],['Image to Base64','🧩','Developer','Encode • Decode'],['Text Diff','⇄','Text','Compare text'],['Wi-Fi Info','📶','Network','Network settings shortcut'],['Storage Info','💾','System','Storage tips'],['App Info','📱','System','App version info'],['Web Tools','🌍','Network','URL encode/decode'],['CSV Tools','📊','Files','CSV text helper'],['Unit & Currency','💱','Convert','Unit conversion']];const extras=['Word Counter','Case Converter','Remove Duplicates','Sort Lines','Reverse Text','Lorem Ipsum','HTML Escape','HTML Preview','CSS Formatter','JS Formatter','Regex Tester','Timestamp Converter','Unix Time','Binary Converter','Hex Converter','Decimal Converter','URL Encoder','URL Decoder','HTML Entity Tool','SHA-256 Hash','Password Strength','Random Number','Random Picker','Dice Roller','Percentage Calculator','Tip Calculator','Discount Calculator','Age Calculator','Date Difference','Countdown','Pomodoro Timer','Checklist','Quick Memo','Image Rotator','Image Metadata','Favicon Preview','SVG Preview','Palette Generator','Gradient Maker','Contrast Checker','Aspect Ratio','Resolution Calculator','Video Metadata','Audio Metadata','File Extension Lookup','MIME Lookup','PDF Page Counter','PDF Metadata','Markdown Preview','YAML Formatter','XML Formatter','SQL Formatter','Cron Helper','IP Format Helper','HTTP Status Lookup','User Agent Viewer','Link Cleaner','QR Generator','Emoji Search','Symbol Picker','Typing Test','Reading Time','Word Frequency','Text to Slug','Slug to Text','Whitespace Cleaner','Line Numberer','Text Joiner','Text Splitter','Character Map','Color Contrast','PX to REM','REM to PX','DP to PX','Data Size Converter','Speed Converter','Temperature Converter','Length Converter','Weight Converter','Volume Converter','Time Converter','Angle Converter','Roman Numerals','Number to Words','Base Converter','JSON to CSV','CSV to JSON','List Merger','List Comparator','Duplicate Finder','Privacy Checklist','Device Diagnostics','Battery Tips','Clipboard Notes','Share Text','Export Text','Import Text','About G.I TOOL'];extras.forEach((n,i)=>groups.push([n,'✦',['Text','Developer','Convert','Productivity','Files','Security'][i%6],'Utility tool']));const cats=['All','AI','Media','Files','Create','Network','Developer','Security','Text','Convert','Productivity','System'];let cat='All',favorites=new Set(JSON.parse(localStorage.getItem('gi_favs')||'[]'));const grid=document.getElementById('grid');function renderFilters(){document.getElementById('filters').innerHTML=cats.map(c=>'<button class="filter '+(c===cat?'active':'')+'" onclick="setCat('+JSON.stringify(c)+')">'+c+'</button>').join('')}function render(){let q=document.getElementById('search').value.toLowerCase();let list=groups.filter(g=>(cat==='All'||g[2]===cat)&&g[0].toLowerCase().includes(q));grid.innerHTML=list.length?list.map(g=>'<article class="card" onclick="openTool('+JSON.stringify(g[0])+')"><div class="ico">'+g[1]+'</div><div class="name">'+g[0]+'</div><div class="desc">'+g[3]+'</div><div class="count">'+(favorites.has(g[0])?'♥ SAVED':'OPEN TOOL　›')+'</div></article>').join(''):'<div class="empty">No tools found.</div>'}function setCat(c){cat=c;renderFilters();render()}function goHome(){document.getElementById('home').hidden=false;document.getElementById('toolview').hidden=true;render()}function showFavorites(){document.getElementById('home').hidden=false;document.getElementById('toolview').hidden=true;cat='All';renderFilters();let q=document.getElementById('search');q.value='';grid.innerHTML=groups.filter(g=>favorites.has(g[0])).map(g=>'<article class="card" onclick="openTool('+JSON.stringify(g[0])+')"><div class="ico">'+g[1]+'</div><div class="name">'+g[0]+'</div><div class="count">OPEN TOOL ›</div></article>').join('')||'<div class="empty">No favorites yet. Use ♡ Save inside a tool.</div>'}function showAbout(){openTool('About G.I TOOL')}function saveFav(n){favorites.has(n)?favorites.delete(n):favorites.add(n);localStorage.setItem('gi_favs',JSON.stringify([...favorites]));render()}function field(id,ph='Enter text...'){return '<textarea class="field" id="'+id+'" placeholder="'+ph+'" rows="4"></textarea>'}function out(){return '<div class="result" id="result">Result appears here.</div>'}function btn(label,fn){return '<button class="btn primary" onclick="'+fn+'">'+label+'</button>'}function toolForm(n){let t='';
if(['Text Utilities','Word Counter','Case Converter','Remove Duplicates','Sort Lines','Reverse Text','Whitespace Cleaner','Line Numberer','Text Joiner','Text Splitter','Text to Slug','Slug to Text','Reading Time','Word Frequency','Text Diff','CSV Tools','CSV to JSON','JSON to CSV','List Merger','List Comparator','Duplicate Finder','Markdown Editor','Markdown Preview','HTML Escape','HTML Preview','Lorem Ipsum'].includes(n)){t=field('inputText','Type or paste text here...')+ '<div class="row"><button class="btn" onclick="textAction('+JSON.stringify(n)+')">Run '+n+'</button><button class="btn" onclick="copyResult()">Copy result</button></div>'+out()}
else if(['JSON Formatter','YAML Formatter','XML Formatter','CSS Formatter','JS Formatter','SQL Formatter'].includes(n)){t=field('inputText','Paste JSON or code here...')+'<div class="row"><button class="btn primary" onclick="formatJSON()">Format / Validate JSON</button><button class="btn" onclick="copyResult()">Copy</button></div>'+out()}
else if(['Image to Base64','Base Converter','Binary Converter','Hex Converter','Decimal Converter','URL Encoder','URL Decoder','HTML Entity Tool'].includes(n)){t=field('inputText','Enter text or value...')+'<div class="row"><button class="btn primary" onclick="convertAction('+JSON.stringify(n)+')">Convert</button><button class="btn" onclick="copyResult()">Copy</button></div>'+out()}
else if(['Calculator','Percentage Calculator','Tip Calculator','Discount Calculator'].includes(n)){t='<label>Expression (example: (12+8)*3)</label><input class="field" id="expr" placeholder="12 + 8 * 3"><button class="btn primary" onclick="calculate()">Calculate</button>'+out()+'<p class="muted">For safety, supports numbers and basic arithmetic operators only.</p>'}
else if(['Password Generator','Secure Random Guide','Random Number','Dice Roller','Random Picker'].includes(n)){t='<label>Length / count</label><input class="field" id="length" type="number" value="20" min="1" max="128"><label>Optional words / items (for picker, one per line)</label>'+field('inputText','apple\nbanana\norange')+'<button class="btn primary" onclick="randomAction('+JSON.stringify(n)+')">Generate</button>'+out()}
else if(['UUID Generator'].includes(n)){t='<button class="btn primary" onclick="setResult(crypto.randomUUID?crypto.randomUUID():fallbackUUID())">Generate UUID</button>'+out()}
else if(['Color Picker','Palette Generator','Gradient Maker','Color Contrast'].includes(n)){t='<label>Choose a color</label><input id="color" type="color" value="#35ff91" style="width:100%;height:55px" oninput="colorAction()"><button class="btn primary" onclick="colorAction()">Show color values</button>'+out()}
else if(['Notes','Quick Memo','Checklist','Clipboard Notes'].includes(n)){t=field('inputText','Your notes (saved on this device)...')+'<div class="row"><button class="btn primary" onclick="saveNotes()">Save note</button><button class="btn" onclick="loadNotes()">Load saved note</button></div>'+out()}
else if(['Stopwatch','Pomodoro Timer','Countdown'].includes(n)){t='<div class="result" id="clock">00:00.0</div><div class="row"><button class="btn primary" onclick="startWatch()">Start</button><button class="btn" onclick="stopWatch()">Stop</button><button class="btn" onclick="resetWatch()">Reset</button></div>'}
else if(['Unit Converter','Length Converter','Weight Converter','Temperature Converter','Volume Converter','Time Converter','Speed Converter','Data Size Converter','Aspect Ratio','PX to REM','REM to PX','DP to PX'].includes(n)){t='<label>Value</label><input class="field" id="unitVal" type="number" value="1"><label>Convert</label><select id="unitType" class="field"><option value="kmmi">Kilometers → Miles</option><option value="mft">Meters → Feet</option><option value="kglb">Kilograms → Pounds</option><option value="clf">Celsius → Fahrenheit</option><option value="mbgb">MB → GB</option><option value="minsec">Minutes → Seconds</option><option value="pxrem">PX → REM (16px base)</option></select><button class="btn primary" onclick="unitAction()">Convert</button>'+out()}
else if(['World Clock','Unix Time','Timestamp Converter','Date Difference','Age Calculator'].includes(n)){t='<button class="btn primary" onclick="setResult(new Date().toString()+'+JSON.stringify('\nUnix timestamp: ')+ '+Math.floor(Date.now()/1000))">Show current date/time</button>'+out()}
else if(['SHA-256 Hash','Security Check','Password Strength'].includes(n)){t=field('inputText','Enter text to check or hash...')+'<button class="btn primary" onclick="hashAction()">Calculate SHA-256</button>'+out()}
else if(['QR Generator','QR & Barcode','QR Reader'].includes(n)){t=field('inputText','Enter text or URL for QR payload...')+'<button class="btn primary" onclick="setResult(document.getElementById(\'inputText\').value ? \'QR payload ready to copy. Built-in QR image generation needs an offline QR encoder module.\\n\\n\'+document.getElementById(\'inputText\').value : \'Enter text first.\')">Prepare QR payload</button>'+out()}
else if(['About G.I TOOL'].includes(n)){t='<p>G.I TOOL is an all-in-one utility dashboard. Tool modules are being added in stages.</p><p class="muted">Works offline for local text tools. Online AI, PDF/image processing, and network diagnostics need dedicated integrations.</p>'}
else{t='<p class="muted">This tool is listed in the catalog, but its dedicated function has not been implemented yet. It will not pretend to run a feature that is not available.</p><p class="muted">Available now: text utilities, JSON validation, calculator, password generator, UUID, color values, local notes, stopwatch, basic unit conversion, date/time, URL conversion and SHA-256 hashing.</p>'}
return t}
let watchStart=0,watchElapsed=0,watchTimer=null;function openTool(n){document.getElementById('home').hidden=true;document.getElementById('toolview').hidden=false;document.getElementById('tooltitle').textContent=n;document.getElementById('toolbody').innerHTML=toolForm(n)+'<div style="margin-top:12px"><button class="back" onclick="saveFav('+JSON.stringify(n)+')">'+(favorites.has(n)?'♥ Saved — toggle favorite':'♡ Save favorite')+'</button></div>';window.scrollTo(0,0)}
function setResult(s){let e=document.getElementById('result');if(e)e.textContent=String(s)}function copyResult(){let e=document.getElementById('result');if(e)navigator.clipboard.writeText(e.textContent).then(()=>{}).catch(()=>setResult(e.textContent+'\n\nClipboard unavailable; select and copy manually.'))}
function textAction(n){let s=document.getElementById('inputText').value,r=s;try{switch(n){case'Word Counter':case'Text Utilities':r='Characters: '+s.length+'\nWords: '+(s.trim()?s.trim().split(/\s+/).length:0)+'\nLines: '+(s? s.split(/\n/).length:0);break;case'Case Converter':r=s.toUpperCase()+'\n\n'+s.toLowerCase()+'\n\n'+s.replace(/\b\w/g,c=>c.toUpperCase());break;case'Remove Duplicates':r=[...new Set(s.split(/\r?\n/))].join('\n');break;case'Sort Lines':r=s.split(/\r?\n/).sort((a,b)=>a.localeCompare(b)).join('\n');break;case'Reverse Text':r=[...s].reverse().join('');break;case'Whitespace Cleaner':r=s.split('\n').map(x=>x.trim().replace(/\s+/g,' ')).filter(Boolean).join('\n');break;case'Line Numberer':r=s.split('\n').map((x,i)=>(i+1)+'. '+x).join('\n');break;case'Text Joiner':r=s.split(/\r?\n/).filter(Boolean).join(', ');break;case'Text Splitter':r=s.split(/[,;\s]+/).filter(Boolean).join('\n');break;case'Text to Slug':r=s.toLowerCase().trim().replace(/[^\w\s-]/g,'').replace(/[\s_-]+/g,'-');break;case'Slug to Text':r=s.replace(/[-_]+/g,' ');break;case'Reading Time':r='Estimated reading time: '+Math.max(1,Math.ceil(s.trim().split(/\s+/).filter(Boolean).length/200))+' minute(s)';break;case'Word Frequency':r=Object.entries(s.toLowerCase().match(/[\p{L}\p{N}']+/gu)||[] .reduce((a,w)=>(a[w]=(a[w]||0)+1,a),{})).sort((a,b)=>b[1]-a[1]).map(x=>x.join(': ')).join('\n');break;case'HTML Escape':r=s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');break;case'HTML Preview':r='Preview is not enabled in this safe text panel. Source:\n'+s;break;case'Lorem Ipsum':r='Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.';break;case'Text Diff':r='Lines in text: '+s.split('\n').length+'\nEnter the second text in a future compare module; current input is counted.';break;case'CSV Tools':r='Rows: '+(s.trim()?s.trim().split(/\r?\n/).length:0)+'\nColumns in first row: '+((s.split(/\r?\n/)[0]||'').split(',').length);break;case'CSV to JSON':r=JSON.stringify(s.trim().split(/\r?\n/).map(x=>x.split(',')),null,2);break;case'JSON to CSV':{let a=JSON.parse(s);r=Array.isArray(a)?a.map(row=>Array.isArray(row)?row.join(','):Object.values(row).join(',')).join('\n'):'Input must be a JSON array';break;}case'List Merger':r=[...new Set(s.split('\n').filter(Boolean))].join('\n');break;case'List Comparator':r='Unique items:\n'+[...new Set(s.split('\n'))].join('\n');break;case'Duplicate Finder':{let a=s.split('\n');r=a.filter((x,i)=>a.indexOf(x)!==i).join('\n')||'No duplicates found';break;}case'Markdown Editor':case'Markdown Preview':r=s;break;default:r=s.length+' characters\n'+(s.trim()?s.trim().split(/\s+/).length:0)+' words';}}catch(e){r='Error: '+e.message}setResult(r)}
function formatJSON(){try{let x=JSON.parse(document.getElementById('inputText').value);setResult(JSON.stringify(x,null,2))}catch(e){setResult('Invalid JSON: '+e.message)}}
function convertAction(n){let s=document.getElementById('inputText').value;try{if(n==='URL Encoder')s=encodeURIComponent(s);else if(n==='URL Decoder')s=decodeURIComponent(s);else if(n==='Image to Base64')s=btoa(unescape(encodeURIComponent(s)));else if(n==='Base Converter')s='Binary: '+Number(s).toString(2)+'\nHex: '+Number(s).toString(16)+'\nDecimal: '+parseInt(s,2);else if(n==='Binary Converter')s=parseInt(s,2);else if(n==='Hex Converter')s=parseInt(s,16);else if(n==='Decimal Converter')s=Number(s).toString(10);else if(n==='HTML Entity Tool')s=s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');setResult(s)}catch(e){setResult('Could not convert: '+e.message)}}
function calculate(){let s=document.getElementById('expr').value;if(!/^[0-9+\-*/().%\s]+$/.test(s)){setResult('Only numbers and + - * / % parentheses are allowed.');return}try{let v=Function('"use strict";return ('+s+')')();setResult(Number.isFinite(v)?v:'Invalid calculation')}catch(e){setResult('Invalid expression')}}
function randomAction(n){let len=Math.max(1,Math.min(128,Number(document.getElementById('length').value)||20)),s=document.getElementById('inputText').value;let r;if(n==='Random Picker'){let a=s.split('\n').filter(Boolean);r=a.length?a[Math.floor(Math.random()*a.length)]:'Enter one item per line.'}else if(n==='Dice Roller')r=1+Math.floor(Math.random()*6);else if(n==='Random Number')r=crypto.getRandomValues(new Uint32Array(1))[0]% (len*10)+1;else {let chars='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%&*_-+=';let arr=crypto.getRandomValues(new Uint8Array(len));r=Array.from(arr,x=>chars[x%chars.length]).join('')}setResult(r)}
function fallbackUUID(){return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{let r=Math.random()*16|0;return(c==='x'?r:(r&3|8)).toString(16)})}
function colorAction(){let c=document.getElementById('color').value;let r=parseInt(c.slice(1,3),16),g=parseInt(c.slice(3,5),16),b=parseInt(c.slice(5,7),16);setResult('HEX: '+c+'\nRGB: rgb('+r+', '+g+', '+b+')\nHSL conversion is not included yet.');}
function saveNotes(){localStorage.setItem('gi_notes',document.getElementById('inputText').value);setResult('Note saved on this device.')}function loadNotes(){document.getElementById('inputText').value=localStorage.getItem('gi_notes')||'';setResult('Saved note loaded.')}
function startWatch(){if(watchTimer)return;watchStart=Date.now()-watchElapsed;watchTimer=setInterval(()=>{watchElapsed=Date.now()-watchStart;let e=document.getElementById('clock');if(e)e.textContent=(watchElapsed/60000|0).toString().padStart(2,'0')+':'+((watchElapsed/1000|0)%60).toString().padStart(2,'0')+'.'+(watchElapsed%1000/100|0)},100)}function stopWatch(){clearInterval(watchTimer);watchTimer=null}function resetWatch(){stopWatch();watchElapsed=0;let e=document.getElementById('clock');if(e)e.textContent='00:00.0'}
function unitAction(){let v=Number(document.getElementById('unitVal').value),t=document.getElementById('unitType').value,f={kmmi:v=>v*0.621371,mft:v=>v*3.28084, kglb:v=>v*2.20462,clf:v=>v*9/5+32,mbgb:v=>v/1024,minsec:v=>v*60,pxrem:v=>v/16};let labels={kmmi:'miles',mft:'feet',kglb:'pounds',clf:'°F',mbgb:'GB',minsec:'seconds',pxrem:'rem'};setResult(f[t](v)+' '+labels[t])}
async function hashAction(){let s=document.getElementById('inputText').value;if(!crypto.subtle){setResult('SHA-256 requires a secure WebView context; unavailable here.');return}let h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));setResult([...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join(''))}
document.getElementById('search').addEventListener('input',render);renderFilters();render();
</script></body></html>
