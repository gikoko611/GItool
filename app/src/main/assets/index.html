<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#031014"><title>G.I TOOL</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 0,#10352a 0,transparent 40%),#020b10;color:#f1f7f8;font-family:system-ui,Arial,sans-serif;padding:20px 16px 90px}.head{display:flex;align-items:center;gap:13px;margin:12px 0 22px}.logo{width:68px;height:68px;border:2px solid #d9b34c;border-radius:50%;display:grid;place-items:center;color:#f7ce64;font-size:27px;font-weight:900;box-shadow:0 0 22px #27ff7755}.brand{font-size:29px;font-weight:900;letter-spacing:1px;background:linear-gradient(90deg,#35ff91,#ffd15d);color:transparent;background-clip:text}.sub{font-size:11px;letter-spacing:2px;color:#bdced2}.search{width:100%;padding:15px;border-radius:18px;background:#0c1b22;border:1px solid #28d99a;color:white;font-size:16px;outline:none}.hero{margin:20px 0;padding:21px;border:1px solid #13d98b;border-radius:20px;background:linear-gradient(120deg,#102e27,#07151d);box-shadow:0 0 25px #00ff7710}.hero h2{margin:0 0 6px;font-size:25px}.green{color:#48f69a}.pill{display:inline-block;border:1px solid #37f596;border-radius:30px;padding:6px 12px;margin:7px 0;font-weight:700}.muted{color:#9cb5c4;font-size:13px}.filters{display:flex;gap:8px;overflow:auto;margin:17px 0}.filter{white-space:nowrap;background:#0b1a21;color:#9fc4d2;border:1px solid #25424b;border-radius:25px;padding:9px 14px}.filter.active{background:#43f59a;color:#032016;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.card{min-height:116px;padding:13px 11px;background:linear-gradient(145deg,#10232b,#08151b);border:1px solid #244650;border-radius:17px;display:flex;flex-direction:column;gap:7px}.ico{font-size:26px}.name{font-weight:750;font-size:14px}.desc{font-size:11px;color:#9cb5c4;line-height:1.4}.count{color:#50f6a0;font-size:11px;margin-top:auto}.bottom{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:#07151cf2;border-top:1px solid #25444a;padding:12px 4px max(12px,env(safe-area-inset-bottom));backdrop-filter:blur(15px)}.bottom button{border:0;background:none;color:#8eacba;font-size:11px}.bottom b{display:block;font-size:20px;margin-bottom:3px}.empty{grid-column:1/-1;text-align:center;color:#9cb5c4;padding:25px}.section{font-size:14px;color:#c3d6d9;margin:18px 2px 12px}</style></head><body><header class="head"><div class="logo">GI</div><div><div class="brand">G.I TOOL</div><div class="sub">ALL-IN-ONE TOOLKIT</div><div class="muted">Simple • Fast • Powerful</div></div></header><input class="search" id="search" placeholder="⌕  Search 100+ tools..."/><section class="hero"><div style="color:#f7c85d">♛ YOUR DIGITAL TOOLKIT</div><h2>Your digital<br><span class="green">Swiss Army knife</span></h2><span class="pill">120+ TOOLS</span><div class="muted">Everything you need, in one app.</div><div class="muted" style="margin-top:8px">Work　•　Create　•　Manage　•　Secure</div></section><div class="section">EXPLORE TOOLS</div><div class="filters" id="filters"></div><main class="grid" id="grid"></main><nav class="bottom"><button onclick="showAll()"><b>⌂</b>Home</button><button onclick="document.getElementById('filters').scrollIntoView({behavior:'smooth'})"><b>▦</b>Categories</button><button onclick="filterFav()"><b>♡</b>Favorites</button><button onclick="alert('Settings will be expanded in a future update.')"><b>⚙</b>Settings</button></nav><script>const groups=[['AI Assistant','🧠','AI','Chat • Generate • Analyze'],['PDF Tools','📕','Files','Convert • Merge • Split'],['Image Studio','🖼️','Media','Edit • Resize • Compress'],['Video Tools','🎬','Media','Convert • Compress • Edit'],['Audio Lab','🎵','Media','Trim • Convert • Record'],['QR & Barcode','▦','Create','Generate • Scan • Decode'],['File Manager','📁','Files','Browse • Organize • Extract'],['Network Tools','🌐','Network udio Metadata','File Extension Lookup','MIME Lookup','Archive Guide','PDF Page Counter','PDF Metadata','Text Extract Helper','Markdown Preview','YAML Formatter','XML Formatter','SQL Formatter','Cron Helper','IP Format Helper','IPv4 Calculator','Subnet Helper','DNS Lookup Helper','HTTP Status Lookup','User Agent Viewer','Link Cleaner','QR Generator','Barcode Guide','Emoji Search','Symbol Picker','Typing Test','Reading Time','Word Frequency','Text to Slug','Slug to Text','Whitespace Cleaner','Line Numberer','Text Joiner','Text Splitter','Character Map','Color Contrast','PX to REM','REM to PX','DP to PX','Aspect Converter','Data Size Converter','Speed Converter','Temperature Converter','Length Converter','Weight Converter','Volume Converter','Time Converter','Angle Converter','Roman Numerals','Number to Words','Base Converter','JSON to CSV','CSV to JSON','List Merger','List Comparator','Duplicate Finder','File Checksum Guide','Secure Random Guide','Privacy Checklist','Permission Guide','Device Diagnostics','Battery Tips','Network Diagnostics','Clipboard Notes','Share Text','Export Text','Import Text','Quick Settings Guide','About G.I TOOL'];extras.forEach((n,i)=>groups.push([n,'✦',['Text','Developer','Convert','Productivity','Files','Security'][i%6], 'Quick utility • Offline-ready']));const cats=['All','AI','Media','Files','Create','Network','Developer','Security','Text','Convert','Productivity','System'];let cat='All',favorites=new Set();const grid=document.getElementById('grid');function renderFilters(){document.getElementById('filters').innerHTML=cats.map(c=>`<button class="filter ${c===cat?'active':''}" onclick="setCat('${c}')">${c}</button>`).join('')}function render(){let q=document.getElementById('search').value.toLowerCase();let list=groups.filter(g=>(cat==='All'||g[2]===cat)&&g[0].toLowerCase().includes(q));grid.innerHTML=list.length?list.map(g=>`<article class="card" onclick="openTool('${g[0].replace(/'/g,'')}')"><div class="ico">${g[1]}</div><div class="name
